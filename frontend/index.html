<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Online Store</title>
</head>
<body>

<h1>Secure Online Store</h1>

<nav>
    <a href="index.html">Products</a> |
    <a href="login.html">Login</a> |
    <a href="register.html">Register</a> |
    <a href="cart.html">My Cart</a> |
    <a href="admin.html">Admin</a>
    <button id="logoutBtn">Logout</button>
</nav>

<hr>

<p id="userInfo"></p>
<h2>Products</h2>
<p id="message" role="alert"></p>
<div id="products"></div>

<script src="https://cdn.jsdelivr.net/npm/xss/dist/xss.min.js"></script>
<script src="app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const user     = getUser();
    const userInfo = document.getElementById("userInfo");

    if (user) {
        userInfo.textContent = "Logged in as: " + escapeHtml(user.name) + " (" + escapeHtml(user.role) + ")";
    } else {
        userInfo.textContent = "Not logged in.";
    }

    loadProducts();

    document.getElementById("logoutBtn").addEventListener("click", function () {
        logout();
    });
});

async function loadProducts() {
    const result    = await apiGet("/products");
    const container = document.getElementById("products");
    const msgEl     = document.getElementById("message");

    if (!result.success) {
        msgEl.textContent = "Failed to load products: " + escapeHtml(result.message || "Error");
        return;
    }

    const products = result.data;
    if (!products || products.length === 0) {
        container.textContent = "No products available.";
        return;
    }

    container.innerHTML = "";

    products.forEach(function (p) {
        const div   = document.createElement("div");
        const title = document.createElement("h3");
        title.textContent = p.name;

        const price = document.createElement("p");
        price.textContent = "Price: $" + p.price;

        const desc  = document.createElement("p");
        desc.textContent = p.description || "";

        const stock = document.createElement("p");
        stock.textContent = "Stock: " + p.stock;

        // Use event listener — NO onclick attribute
        const btn = document.createElement("button");
        btn.textContent = "Add to Cart";
        btn.dataset.productId = p._id;
        btn.addEventListener("click", function () {
            addToCart(this.dataset.productId);
        });

        div.appendChild(title);
        div.appendChild(price);
        div.appendChild(desc);
        div.appendChild(stock);
        div.appendChild(btn);
        div.appendChild(document.createElement("hr"));

        container.appendChild(div);
    });
}

async function addToCart(productId) {
    const token = getToken();
    if (!token) {
        alert("Please login first");
        window.location.href = "login.html";
        return;
    }

    const result = await apiPost("/cart/add", { productId, quantity: 1 });

    if (result.success) {
        alert("Item added to cart!");
    } else {
        alert("Error: " + escapeHtml(result.message || "Failed to add item"));
    }
}
</script>

</body>
</html>
